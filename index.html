<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2854b0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>すしがっぽり 舟盛ベット計算</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f3;--fg:#17212b;--mut:#5d6b78;--card:#fff;--line:#cfd7de;--ink:#1f3a5f;--hit:#c62f47;--ok:#1d7a4d;--p1:#2563c9;--p2:#b85c00;--p3:#1f8a5b;--p4:#7c4dc4;--p5:#c2257a;--p6:#0b7f91;--p7:#8a6a00;--p8:#5b6770}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 2px;color:var(--ink)}h2{font-size:16px;margin:0 0 8px;color:var(--ink)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
input[type=range]{padding:0}
.row{display:flex;gap:10px}.row>div{flex:1}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pad button{font:inherit;font-size:18px;padding:12px 0;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;touch-action:manipulation}
.pad button.o{border-color:var(--hit);color:var(--hit)}.pad button:active{background:var(--ink);color:var(--card)}
.stair{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:4px;--sz:12px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell{width:var(--sz);height:var(--sz);border:1.5px solid var(--line);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*.6);line-height:1}
.cell.on{border-color:transparent}.cell.oy{border-color:var(--hit);color:var(--hit);font-weight:700}
.bd{font-size:11px;font-weight:700;min-height:15px;line-height:15px;white-space:nowrap}
.big{--sz:22px;margin-top:10px;padding:6px 0}.big .bd{color:var(--mut);font-weight:400}
.tip{font-size:12px;color:var(--mut);margin-top:4px}
.pl{border-left:5px solid var(--c);padding:2px 0 2px 10px;margin:12px 0}
.ph{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}.ph b{font-size:16px;color:var(--c)}.ph span{font-size:13px;color:var(--mut)}
.plate{display:flex;gap:12px;align-items:flex-end;padding:8px 0;border-top:1px solid var(--line)}.plate:first-of-type{border-top:0}
.mini{min-width:96px}.m{font-size:13px;color:var(--mut)}
.total{border:2px solid var(--ink);border-radius:6px;padding:10px 12px;margin:8px 0}.tl{font-size:13px;color:var(--mut)}.tv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.tv>div{display:flex;flex-direction:column}.tv .k{font-size:11px;color:var(--mut);line-height:1.3}.tv b{font-size:22px;line-height:1.25}
.sum{font-size:14px;margin-top:6px;padding-top:8px;border-top:2px solid var(--ink)}
.pos{color:var(--ok)}.neg{color:var(--hit)}.note{font-size:12px;color:var(--mut);margin-top:8px}
.best-n{font-size:16px;margin:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}td,th{padding:4px 6px;text-align:right;border-top:1px solid var(--line)}th{color:var(--mut);font-weight:400}tr.best td{font-weight:700;color:var(--ink)}
details{margin-top:10px}summary{cursor:pointer;color:var(--ink);font-size:14px}
.o5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell.ball{background:var(--hit);color:#fff;border-color:transparent;font-weight:700}.big .cell{cursor:pointer}
.btn{font:inherit;padding:9px 12px;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px}.btn.pri{background:var(--ink);color:var(--card)}
.rowb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.act{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px}.act label{margin:0;display:flex;gap:4px;align-items:center}.act input[type=number]{width:84px;padding:4px 6px}.act select{width:auto;padding:4px 6px}
.params{border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-top:10px}textarea{width:100%;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

section{background:#efd8a8 var(--wood) top center/100% auto repeat-y;border:3px solid #b98a4e;border-radius:16px;box-shadow:0 4px 0 #8f6a38}
section input,section select{background:rgba(255,252,245,.92)}
.params{background:rgba(255,252,245,.5)}.total{background:rgba(255,252,245,.72)}.cell{background-color:rgba(255,255,255,.8)}
.big{gap:6px;padding:10px 0}
input,select{font-size:18px;line-height:1.2;height:40px;padding:0 10px}input[type=range]{height:auto}
#board{font-size:22px;font-weight:700;letter-spacing:.06em}
