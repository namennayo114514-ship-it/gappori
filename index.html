<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>すしがっぽり 舟盛ベット計算</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f3;--fg:#17212b;--mut:#5d6b78;--card:#fff;--line:#cfd7de;--ink:#1f3a5f;--hit:#c62f47;--ok:#1d7a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e8edf2;--mut:#93a1ae;--card:#18212b;--line:#2c3947;--ink:#8db4ee;--hit:#ff6b81;--ok:#58d39b}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e8edf2;--mut:#93a1ae;--card:#18212b;--line:#2c3947;--ink:#8db4ee;--hit:#ff6b81;--ok:#58d39b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 2px;color:var(--ink)}h2{font-size:16px;margin:0 0 8px;color:var(--ink)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}input[type=range]{padding:0}
.row{display:flex;gap:10px}.row>div{flex:1}
.board{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.pad button{font:inherit;font-size:18px;padding:12px 0;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;touch-action:manipulation}.pad button.o{border-color:var(--hit);color:var(--hit)}.pad button:active{background:var(--ink);color:var(--card)}
.chip{border:1px solid var(--ink);border-radius:3px;padding:1px 8px;font-size:13px}.chip.o{border-color:var(--hit);color:var(--hit)}
.warn{color:var(--hit);font-size:13px;margin-top:6px}
.plate{border-top:1px solid var(--line);padding:9px 0}.plate:first-of-type{border-top:0}
.combo{font-size:17px;font-weight:700;letter-spacing:.04em}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut)}
.meta b{color:var(--fg)}.sum{font-size:14px;margin-top:6px;padding-top:8px;border-top:2px solid var(--ink)}
.sum b{color:var(--hit)}
.pos{color:var(--ok)}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}td,th{padding:4px 6px;text-align:right;border-top:1px solid var(--line)}th{color:var(--mut);font-weight:400}tr.best td{font-weight:700;color:var(--ink)}.best-n{font-size:16px}.neg{color:var(--hit)}
.sel{display:flex;gap:8px}.note{font-size:12px;color:var(--mut);margin-top:8px}
details summary{cursor:pointer;color:var(--ink);font-size:14px}
.o5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style></head><body><main>
<h1>すしがっぽり 舟盛ベット計算</h1>
<p class="sub">盤面を円周の並び順で入力すると、最適な舟盛の数と賭け方を提案します。</p>

<section>
<h2>盤面と条件</h2>
<label for="board">盤面(円周の順。おやじは「お」)</label>
<input id="board" value="4-お-4-3-3-1" inputmode="none" autocomplete="off">
<div class="pad" id="pad"></div>
<div class="board" id="legend"></div><div class="warn" id="warn"></div>
<div class="row">
<div><label for="bet">1皿のBET(枚)</label><input id="bet" type="number" value="10" min="1"></div>
<div><label for="f">フリーチョイス確率(%)</label><input id="f" type="number" value="78" min="0" max="100"></div>
</div>
<div class="row">
<div><label for="mn">最小皿数</label><input id="mn" type="number" value="1" min="1" max="15"></div>
<div><label for="mx">最大皿数</label><input id="mx" type="number" value="10" min="1" max="15"></div>
</div>
<div class="row">
<div><label for="mode">モード</label><select id="mode"><option value="s">堅実(当たれば必ず増える)</option><option value="a">攻め(当たれば大きく増える)</option></select></div>
<div><label for="k">攻めの目標(配当÷投入)</label><input id="k" type="number" value="2" min="1" step="0.1"></div>
</div>
<label for="q">隣に入りやすい補正: <span id="qv">0%</span>(0%=完全ランダム)</label>
<input id="q" type="range" min="0" max="60" value="0">
<details style="margin-top:10px"><summary>配当モデル(1球あたりの倍率)</summary>
<div class="o5" id="o5"></div>
<p class="note">個数1〜5のネタの倍率。配当 = 5球分の倍率の積 ÷ 並び方の数(×BET/10)。12+3件の実測にあてはめた推定で、誤差は約6%以内です。</p></details>
</section>

<section><h2>おすすめの賭け方</h2><div id="res"></div></section>

<section><h2>フリーチョイス(3球目まで入った後)</h2>
<div class="sel" id="b3"></div><div id="fcres" style="margin-top:8px"></div>
<p class="note">フリーチョイス権がある前提で、残り2球は完全ランダムとして計算しています。</p></section>
<p class="note">確率は盤面のポケット数に基づく見積りで、実機の抽選を保証するものではありません。配当は機械の表示を優先してください。</p>
</main>
<script>
const $=id=>document.getElementById(id),LB='ABCDEFGHIJKL',F=[1,1,2,6,24,120];
const O={1:11.2,2:7.1,3:5.1,4:4.0,5:3.3};
const odds=c=>O[c]||15/c*1.1,pc=x=>(x*100).toFixed(1)+'%';
let G={},lastKey='';
$('o5').innerHTML=[1,2,3,4,5].map(c=>`<div><label>${c}個</label><input type="number" step="0.1" id="o${c}" value="${O[c]}"></div>`).join('');
function parse(){
 const seq=[],pk=[],cnt=[];let oya=0;
 for(const t of $('board').value.split(/[\s,、\-ー−–—]+/).filter(Boolean)){
  if(/^(お|おやじ|o|0)$/i.test(t)){seq.push({o:1});pk.push(-1);oya++}
  else if(/^\d+$/.test(t)&&+t>0){const c=+t;cnt.push(c);seq.push({i:cnt.length-1,c});for(let k=0;k<c;k++)pk.push(cnt.length-1)}
 }
 const n=cnt.length;return{seq,cnt,n,oya,len:pk.length,pk:pk.map(x=>x<0?n:x)};
}
function payout(S,cnt,bet){let p=1,co=120;S.forEach((k,i)=>{if(k){p*=Math.pow(odds(cnt[i]),k);co/=F[k]}});return p/co*bet/10}
function gen(n){const out=[],cur=new Array(n).fill(0);(function r(i,left){if(i==n-1){cur[i]=left;out.push(cur.slice());return}for(let k=0;k<=left;k++){cur[i]=k;r(i+1,left-k)}})(0,5);return out}
function dist(pk,n,q){
 const L=pk.length;let st=new Map();
 const add=(m,i,v,p)=>{const k=i+'|'+v.join();const e=m.get(k);if(e)e[2]+=p;else m.set(k,[i,v,p])};
 for(let i=0;i<L;i++){const v=new Array(n+1).fill(0);v[pk[i]]=1;add(st,i,v,1/L)}
 for(let s=1;s<5;s++){const ns=new Map();
  for(const [i,v,p] of st.values())for(let j=0;j<L;j++){
   const pr=(1-q)/L+(j==(i+1)%L?q:0);if(!pr)continue;
   const v2=v.slice();v2[pk[j]]++;add(ns,j,v2,p*pr)}
  st=ns}
 const agg=new Map();
 for(const [i,v,p] of st.values()){const k=v.join();const e=agg.get(k);if(e)e.p+=p;else agg.set(k,{v,p})}
 return[...agg.values()];
}
function hits(D,S,fc){const h=[];D.forEach((d,j)=>{let m=0;for(let i=0;i<S.length;i++)m+=Math.max(0,S[i]-d.v[i]);if(m<=(fc?1:0))h.push(j)});return h}
const name=S=>S.map((k,i)=>k?LB[i]+(k>1?'×'+k:''):'').filter(Boolean).join(' ');
function build(D,cand,N,bet,k){
 const pool=cand.filter(c=>c.pay>bet*N*k),miss=new Float64Array(D.length).fill(1),sel=[];
 for(let k=0;k<N;k++){let bi=-1,bg=-1;
  pool.forEach((c,i)=>{if(c.used)return;let g=0;for(const[j,h]of c.h)g+=D[j].p*miss[j]*h;if(g>bg){bg=g;bi=i}});
  if(bi<0)break;const c=pool[bi];c.used=1;c.h.forEach(([j,h])=>miss[j]*=1-h);sel.push(c)}
 pool.forEach(c=>c.used=0);
 let any=0,ev=0;D.forEach((d,j)=>any+=d.p*(1-miss[j]));
 sel.forEach(c=>c.h.forEach(([j,h])=>ev+=D[j].p*h*c.pay));
 const cost=bet*sel.length,avg=any>0?ev/any-cost:0;
 return{N,sel,any,avg,ev:ev-cost,cost,min:sel.length?Math.min(...sel.map(c=>c.pay))-cost:0};
}
function update(){
 for(let c=1;c<=5;c++)O[c]=+$('o'+c).value||O[c];
 const b=parse(),q=+$('q').value/100,bet=+$('bet').value||10,f=Math.min(1,Math.max(0,(+$('f').value||0)/100)),mode=$('mode').value,k=mode=='a'?Math.max(1,+$('k').value||2):1;
 $('qv').textContent=$('q').value+'%';
 $('legend').innerHTML=b.seq.map(s=>s.o?'<span class="chip o">お</span>':`<span class="chip">${LB[s.i]}(${s.c})</span>`).join('');
 $('warn').textContent=`合計 ${b.len}/16マス`+(b.len>16?'(多すぎます)':'');$('warn').style.color=b.len==16?'var(--ok)':b.len>16?'var(--hit)':'var(--mut)';
 if(!b.n||b.n>LB.length){$('res').textContent='盤面を入力してください。例: 4-お-4-3-3-1';return}
 const D=dist(b.pk,b.n,q);G={b,D,bet,sel:[]};
 const cand=gen(b.n).map(S=>({S,pay:payout(S,b.cnt,bet)})).filter(c=>c.pay>bet);
 cand.forEach(c=>{const h0=new Set(hits(D,c.S,0));c.p0=0;c.p1=0;c.pe=0;
  c.h=hits(D,c.S,1).map(j=>{const z=h0.has(j),h=z?1:f;c.p1+=D[j].p;c.pe+=D[j].p*h;if(z)c.p0+=D[j].p;return[j,h]})});
 const R=[];const cl=(x,d)=>Math.min(15,Math.max(1,Math.round(+x)||d));let mn=cl($('mn').value,1),mx=cl($('mx').value,10);if(mn>mx)[mn,mx]=[mx,mn];for(let N=mn;N<=mx;N++){const r=build(D,cand,N,bet,k);if(r.sel.length==N)R.push(r)}
 if(!R.length){$('res').innerHTML=`<p>条件を満たす組み合わせがありません。攻めの目標を下げてください。</p>`;fcRender();return}
 const best=R.reduce((a,r)=>r.ev>a.ev?r:a);
 G.sel=best.sel;
 const fm=x=>`<span class="${x>=0?'pos':'neg'}">${x>=0?'+':''}${x.toFixed(0)}枚</span>`;
 $('res').innerHTML=`<p class="best-n">おすすめは <b>${best.N}皿</b>(投入 ${best.cost}枚)</p>`
  +best.sel.map(c=>`<div class="plate"><div class="combo">${name(c.S)}</div><div class="meta"><span>配当 <b>${c.pay.toFixed(0)}枚</b></span><span>当たり時 ${fm(c.pay-best.cost)}(${(c.pay/best.cost).toFixed(1)}倍)</span><span>確率 FCなし ${pc(c.p0)} / あり ${pc(c.p1)}</span></div></div>`).join('')
  +`<div class="sum">どれか当たる確率 <b>${pc(best.any)}</b> ／ 当たり時の平均 ${fm(best.avg)} ／ 期待収支 ${fm(best.ev)}</div>`
  +`<table><tr><th>皿数</th><th>当たる確率</th><th>期待収支</th><th>当たり時の平均</th></tr>`
  +R.map(r=>`<tr class="${r==best?'best':''}"><td>${r.N}</td><td>${pc(r.any)}</td><td>${fm(r.ev)}</td><td>${fm(r.avg)}</td></tr>`).join('')+`</table>`
  +`<p class="note">フリーチョイスは皿ごとに${(f*100).toFixed(0)}%でもらえる前提です。</p>`;
 const key=b.seq.map(s=>s.o?'o':s.c).join('-');
 if(key!=lastKey){lastKey=key;const op=[...Array(b.n).keys()].map(i=>`<option value="${i}">${LB[i]}(${b.cnt[i]})</option>`).join('')+(b.oya?`<option value="${b.n}">お</option>`:'');
  $('b3').innerHTML=[1,2,3].map(k=>`<div style="flex:1"><label>${k}球目</label><select class="s3">${op}</select></div>`).join('');
  document.querySelectorAll('.s3').forEach(s=>s.onchange=fcRender)}
 fcRender();
}
const sum=(D,h)=>h.reduce((a,j)=>a+D[j].p,0);
function p2(r,pt,n){let s=0;for(let a=0;a<=n;a++)for(let b=0;b<=n;b++){const c=new Array(n+1).fill(0);c[a]++;c[b]++;let ok=1;for(let i=0;i<=n;i++)if(r[i]>c[i]){ok=0;break}if(ok)s+=pt[a]*pt[b]}return s}
function fcRender(){
 const{b,sel}=G;if(!b||!sel||!sel.length){$('fcres').innerHTML='';return}
 const n=b.n,pt=b.cnt.map(c=>c/b.len).concat([b.oya/b.len]);
 const v=new Array(n+1).fill(0);document.querySelectorAll('.s3').forEach(s=>{if(s.value!=='')v[+s.value]++});
 $('fcres').innerHTML=sel.map(c=>{
  const m=c.S.map((k,i)=>Math.max(0,k-v[i]));m.push(0);const need=m.reduce((a,x)=>a+x,0);
  let t;
  if(!need)t='<span class="pos">3球で5個そろい済み</span>';
  else{const base=need<=2?p2(m,pt,n):0;let best=-1,bp=-1;
   m.forEach((x,i)=>{if(x>0){const r=m.slice();r[i]--;const p=p2(r,pt,n);if(p>bp){bp=p;best=i}}});
   t=`チョイス <b>${LB[best]}</b> → 残り2球で当たる確率 <b>${pc(bp)}</b>(FCなし ${pc(base)})`+`<br><span class="meta">あと${need}個: ${name(m.slice(0,n))}</span>`}
  return`<div class="plate"><div class="combo">${name(c.S)}</div><div style="font-size:14px">${t}</div></div>`}).join('');
}
$('pad').innerHTML=['1','2','3','4','5','お','←','クリア'].map(t=>`<button type="button" class="${t=='お'?'o':''}" data-t="${t}">${t}</button>`).join('');
$('pad').onclick=e=>{const t=e.target.dataset.t;if(!t)return;const a=$('board').value.split(/[\s,、\-ー−–—]+/).filter(Boolean);if(t=='←')a.pop();else if(t=='クリア')a.length=0;else a.push(t);$('board').value=a.join('-');update()};
['board','bet','f','mn','mx','mode','k','q'].forEach(i=>$(i).addEventListener('input',update));
document.querySelectorAll('#o5 input').forEach(i=>i.addEventListener('input',update));
update();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
